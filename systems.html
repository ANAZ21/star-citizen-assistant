<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>星系航图 · MOBIGLAS 星际公民助手</title>
  <meta name="description" content="星际公民斯坦顿、派罗与尼克斯星系航图：行星、卫星、着陆区、空间站、兴趣点，附风险等级、设施与前往方式。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 3L34 11v18L20 37 6 29V11L20 3z' fill='%2305080e' stroke='%2363d8ff' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%2363d8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/site.css?v=20261135">
  <link rel="stylesheet" href="assets/css/systems.css?v=20261135">
</head>
<body data-page="systems">
  <header id="site-header"></header>

  <main class="app-main">
    <section class="atlas-section" id="atlas">
      <div class="container atlas-head">
        <div>
          <div class="kicker">System Atlas</div>
          <h1 class="atlas-title">星系全境</h1>
          <p class="atlas-sub">拖动旋转，滚轮缩放。选择行星聚焦，选择商店节点查看商品与租赁。</p>
        </div>
        <div class="atlas-head-meta">
          <span><i class="atlas-live"></i> 实时轨道 / LIVE ORBIT</span>
          <span id="atlas-object-count">49 个地点</span>
        </div>
      </div>

      <div class="container">
        <div class="atlas-stage" id="atlas-stage">
          <div class="atlas-canvas" id="atlas-canvas"></div>
          <div class="atlas-nebula"></div>
          <div class="atlas-grid"></div>
          <div class="atlas-scan"></div>

          <div class="atlas-top">
            <div class="atlas-tabs" id="atlas-tabs" role="tablist" aria-label="星系">
              <button class="active" type="button" data-system="stanton" role="tab"><b>斯坦顿</b><small>STANTON</small></button>
              <button type="button" data-system="pyro" role="tab"><b>派罗</b><small>PYRO</small></button>
              <button type="button" data-system="nyx" role="tab"><b>尼克斯</b><small>NYX</small></button>
            </div>
            <div class="atlas-legend">
              <span><i class="dot amber"></i>有飞船出售</span>
              <span><i class="dot cyan"></i>租赁 / 飞船武器</span>
              <span><i class="dot white"></i>行星 / 卫星</span>
            </div>
          </div>

          <div class="atlas-labels" id="atlas-labels"></div>
          <div class="atlas-hint" id="atlas-hint">拖动旋转 · 滚轮缩放 · 点击行星聚焦</div>
          <div class="atlas-focus" id="atlas-focus" hidden>
            <button class="atlas-focus-close" type="button" data-atlas-focus-close aria-label="关闭行星档案">×</button>
            <div class="atlas-focus-copy"><span>行星聚焦 / PLANET FOCUS</span><b id="atlas-focus-name"></b><small id="atlas-focus-meta"></small></div>
            <div class="atlas-focus-stats" id="atlas-focus-stats"></div>
            <div class="atlas-focus-story" id="atlas-focus-story"></div>
            <div class="atlas-focus-sites" id="atlas-focus-sites"></div>
            <div class="atlas-focus-note">拖动或自动旋转时隐藏地点标签，停止后恢复</div>
            <div class="atlas-focus-actions"><button type="button" data-atlas-focus-info>地点档案</button><button type="button" data-atlas-focus-back>返回星系</button></div>
          </div>

          <div class="atlas-bottom">
            <div class="atlas-legend-text">拖动旋转 <span>·</span> 滚轮缩放 <span>·</span> 点击节点查看档案</div>
            <div class="atlas-tools">
              <button type="button" data-atlas-action="zoom-out" aria-label="缩小">−</button>
              <button type="button" data-atlas-action="zoom-in" aria-label="放大">+</button>
              <button type="button" class="wide" data-atlas-action="auto">自动旋转 <i class="rotate-dot active"></i></button>
              <button type="button" class="wide" data-atlas-action="reset">重置视角</button>
              <button type="button" class="wide" data-atlas-action="fullscreen">全屏星图</button>
            </div>
          </div>

          <div class="atlas-loading" id="atlas-loading">
            <span></span>
            <b>正在载入星系航图</b>
            <small>STANTON / PYRO / NYX</small>
          </div>
        </div>
      </div>
    </section>

    <section class="locations-section" id="locations">
      <div class="container">
        <div class="locations-head">
          <div>
            <div class="kicker">Location Index</div>
            <h2 class="locations-title">地点与商店</h2>
            <p class="locations-sub">每张卡片直接列出商店类型、主要商品、租赁与可用设施。</p>
          </div>
          <div class="location-filters" id="location-filters" role="group" aria-label="地点筛选"></div>
        </div>
        <div class="location-grid" id="location-grid"></div>
      </div>
    </section>
  </main>

  <dialog class="location-dialog" id="location-dialog" aria-label="地点档案">
    <div class="location-dialog-shell" id="location-dialog-shell"></div>
  </dialog>

  <footer id="site-footer"></footer>

  <script src="assets/js/data-ships.js"></script>
  <script src="assets/js/data-locations.js"></script>
  <script src="assets/js/data-i18n.js?v=20261135"></script>
  <script src="assets/js/data-media.js"></script>
  <script src="assets/js/data-shops.js"></script>
  <script src="assets/js/data-weapon-stats.js?v=20261135"></script>
  <script src="assets/js/data-stories.js?v=20261135"></script>
  <script src="assets/js/data-copy.js?v=20261135"></script>
  <script src="assets/js/data-location-media.js?v=20261135"></script>
  <script src="assets/js/data-planet-media.js?v=20261135"></script>
  <script src="assets/js/data-nyx.js?v=20261135"></script>
  <script src="assets/js/data-components.js?v=20261135"></script>
  <script src="assets/js/common.js?v=20261135"></script>
  <script type="module" src="assets/js/systems.js?v=20261135"></script>
</body>
</html>
