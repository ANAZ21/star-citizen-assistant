  <header id="site-header"></header>

  <main class="app-main">
    <section class="ships-hero" id="ships-hero">
      <div class="ships-hero-media">
        <div class="ships-hero-slides" id="ships-hero-slides" aria-hidden="true"></div>
      </div>
      <div class="ships-hero-shade" aria-hidden="true"></div>
      <div class="container ships-hero-content">
        <div class="kicker">Ship Database</div>
        <h1 class="large-title">飞船数据库</h1>
        <p class="page-sub">飞船价格、参数、购买地点与租赁方式。</p>
      </div>
      <div class="ships-hero-caption"><span id="ships-hero-caption">Carrack / 探索</span></div>
    </section>

    <section class="section" style="padding-top:22px;padding-bottom:0">
      <div class="container">
        <div class="ships-toolbar">
          <div class="ios-search-field" style="flex:1;min-width:220px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
            <input id="ship-search" type="search" placeholder="搜索船名、制造商、用途" autocomplete="off" aria-label="搜索飞船">
          </div>
          <select class="filter-select" id="maker-filter" aria-label="制造商"></select>
          <select class="filter-select" id="status-filter" aria-label="状态"></select>
          <select class="filter-select" id="sort-select" aria-label="排序">
            <option value="default">默认排序</option>
            <option value="auec-asc">aUEC 从低到高</option>
            <option value="auec-desc">aUEC 从高到低</option>
            <option value="usd-asc">美元从低到高</option>
            <option value="usd-desc">美元从高到低</option>
            <option value="cargo-desc">货舱从大到小</option>
            <option value="speed-desc">速度从高到低</option>
          </select>
          <button class="chip fav" id="fav-filter" type="button">★ 收藏 <small>0</small></button>
          <button class="chip" id="shop-filter" type="button">有购买信息 <small>0</small></button>
        </div>
        <div class="filter-row" style="margin-top:8px">
          <span class="footnote text-secondary" style="flex-shrink:0">用途</span>
          <div class="segmented-scroll" id="role-chips" style="flex:1"></div>
        </div>
        <div class="filter-row" style="margin-top:8px">
          <span class="footnote text-secondary" style="flex-shrink:0">尺寸</span>
          <div class="segmented-scroll" id="size-chips" style="flex:1"></div>
        </div>
        <div class="results-line">
          <span id="result-count">共 215 艘 · 当前 215 艘</span>
          <button class="reset-btn" id="reset-filters" type="button">重置筛选</button>
        </div>
        <h2 class="sr-only">飞船列表</h2>
        <div class="ship-grid" id="ship-grid"></div>
      </div>
    </section>
  </main>

  <div class="compare-tray" id="compare-tray" aria-label="飞船对比栏">
    <span class="tray-label">对比 <span id="tray-count">0 / 3</span></span>
    <div class="tray-chips" id="tray-chips"></div>
    <div class="tray-actions">
      <button class="btn-small" id="compare-clear" type="button" disabled>清空</button>
      <button class="btn-small primary" id="compare-open" type="button" disabled>对比</button>
    </div>
  </div>

  <dialog class="modal" id="ship-modal" aria-label="飞船详情">
    <div class="modal-inner" id="ship-modal-inner"></div>
  </dialog>

  <dialog class="modal" id="compare-dialog" aria-label="飞船对比">
    <div class="modal-inner" id="compare-modal-inner"></div>
  </dialog>
